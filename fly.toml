# app 이름이 이미 선점되어 있으면 fly launch 단계에서 다른 이름을 고르면 된다.
app = "pin-class"
primary_region = "nrt" # 도쿄 — 한국에서 지연이 가장 낮다.

[build]
  [build.args]
    NEXT_PUBLIC_APP_URL = "https://pin.newdawn.co.kr"
    NEXT_PUBLIC_DATA_MODE = "supabase"
    # NEXT_PUBLIC_SUPABASE_URL / NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY 는
    # 저장소에 두지 않고 배포할 때 --build-arg 로 넘긴다.

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1

# 변환된 슬라이드 이미지는 재배포/재시작에도 남아야 한다.
[[mounts]]
  source = "generated"
  destination = "/app/public/generated"

[[vm]]
  size = "shared-cpu-1x"
  memory = "2gb" # LibreOffice 변환이 메모리를 꽤 쓴다.
